version: 2

sources:
  - name: raw
    database: DEMOP
    schema: DBT_PIPELINE
    tables:
      - name: raw_orders
        description: "Raw orders table with all order transactions"
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: customer_id
            tests: [not_null]
          - name: amount
            tests: [not_null]
      - name: raw_customers
        description: "Raw customers master table"
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: raw_products
        description: "Raw products catalog"
        columns:
          - name: product_id
            tests: [unique, not_null]
